[workspace]
resolver = "3"
members = ["apps/diana", "apps/diana-gui", "crates/diana-decomp"]
default-members = ["apps/diana", "crates/diana-decomp"]
# The vendored decompiler core keeps its own workspace so upstream files stay
# comparable with the source revision recorded in vendor/dexdec/VENDOR.md.
exclude = ["vendor/dexdec"]

[profile.release]
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
