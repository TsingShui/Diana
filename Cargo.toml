[workspace]
resolver = "3"
members = [
    "apps/diana",
    "apps/diana-gui",
    "crates/diana-decomp",
    "crates/diana-facts",
    "crates/dexdec",
    "crates/rusty-dex",
]
default-members = ["apps/diana", "crates/diana-decomp"]
# The forked decompiler core inherits only these three fields, so its own files
# stay comparable with the upstream revision in crates/dexdec/UPSTREAM.md.
[workspace.package]
version = "1.0.2"
edition = "2021"
license = "Apache-2.0"

[profile.release]
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
