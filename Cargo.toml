[workspace]
resolver = "3"
members = [
    "apps/diana",
    "apps/diana-gui",
    "crates/diana-decomp",
    "crates/diana-facts",
]
default-members = ["apps/diana", "crates/diana-decomp"]
# Shared package fields for the workspace crates.
[workspace.package]
version = "1.0.2"
edition = "2021"
license = "Apache-2.0"

[profile.release]
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true
