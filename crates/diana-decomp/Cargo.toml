[package]
name = "diana-decomp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

description = "Diana DEX recovery backend"
documentation = "https://github.com/TsingShui/Diana"
keywords = ["android", "dex", "decompiler", "reverse-engineering"]
categories = ["development-tools"]

[features]
default = ["kotlin"]
kotlin = []
perf = []


[dependencies]
diana-facts = { path = "../diana-facts" }
mimalloc = "0.1"
bitflags = "2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
zstd = "0.11"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3.24.0"
