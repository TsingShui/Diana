[package]
name = "diana-facts"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
description = "Diana original DEX facts: input reader, class facts and decoded methods"
license = "Apache-2.0"
publish = false

[lints.rust]
unsafe_code = "forbid"

[dependencies]
memchr = "2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-general-category = "1"
