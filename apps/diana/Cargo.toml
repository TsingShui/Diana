[package]
name = "diana"
version = "0.2.6"
edition = "2024"
rust-version = "1.93"
description = "Native Diana APK/DEX analysis and decompilation CLI"
license = "Apache-2.0"
publish = false
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
diana-decomp = { path = "../../crates/diana-decomp" }
fastrace = { version = "0.7", optional = true }
libdeflater = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
memmap2 = "0.9"
nucleo-matcher = { version = "=0.3.1", default-features = false, features = ["unicode-casefold", "unicode-normalization"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[lints.rust]
# one allow: the read-only input mapping in `analysis::input`.
unsafe_code = "deny"

[features]
perf = ["dep:fastrace", "fastrace/enable", "diana-decomp/perf"]

[[example]]
name = "app_profile"
required-features = ["perf"]

[lints.clippy]
# The recovery pipeline carries structured failure payloads by value: a failed
# semantic step returns the statement or region that could not be transformed.
# Boxing them would change hundreds of hot-path signatures without improving
# failure handling.
result_large_err = "allow"
large_enum_variant = "allow"
too_many_arguments = "allow"
