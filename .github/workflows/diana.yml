name: Diana

# CLI and engine gates: format, lint and release build on Rust 1.93 across
# Linux, macOS and Windows. Releases are handled by release.yml.

on:
  push:
    branches:
      - "**"
    paths:
      - "apps/diana/**"
      - "crates/diana-decomp/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/diana.yml"
  pull_request:
    paths:
      - "apps/diana/**"
      - "crates/diana-decomp/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/diana.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: Gates (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.93.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: diana-gates-${{ matrix.runner }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint CLI and engine
        run: cargo clippy -p diana -p diana-decomp --locked --all-targets --all-features -- -D warnings

      - name: Build CLI and engine
        run: cargo build -p diana -p diana-decomp --locked --release
